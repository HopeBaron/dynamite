services:
  database:
    image: "mongo"
    ports:
      - 27016:27017
    volumes:
      - db-data:/data/db
      - mongo-config:/data/configdb
  app:
    build: .
    working_dir: /code
    ports:
      - 8000:8000
    depends_on:
      - database
    secrets:
      - private_key
      - public_key

volumes:
  db-data:
  mongo-config:

secrets:
  private_key:
    file: ./env/private_key.pem
  public_key:
    file: ./env/private_key.pem