services:
  database:
    image: "mongo"
    ports:
      - 27017:27017
    volumes:
      - db-data:/data/db
      - mongo-config:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
  app:
    build: .
    working_dir: /code
    ports:
      - 8000:8000
    depends_on:
      - database
    secrets:
      - private_key
      - public_key
    environment:
      db_username: root
      db_password: example

volumes:
  db-data:
  mongo-config:

secrets:
  private_key:
    file: ./env/private_key.pem
  public_key:
    file: ./env/private_key.pem